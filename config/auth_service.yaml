grpc_port: ":50051"
http_port: ":8080"
jwt_secret: ""
allowed_origins:
  - "http://localhost:4200"
cookie_secure: false
http_read_timeout: 15s
http_write_timeout: 15s
http_idle_timeout: 60s
shutdown_timeout: 15s
token_cleanup_every: 10m

uploads:
  dir: "./uploads-auth"
  public_path: "/static"
  public_base_url: "http://localhost:8080"
  max_avatar_bytes: 10485760
  max_avatar_side: 512

database:
  host: ""
  port: 5432
  user: ""
  password: ""
  dbname: ""
  sslmode: "disable"